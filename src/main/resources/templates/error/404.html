<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error-box {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
        }
        h1 { color: #1565c0; margin-bottom: 8px; }
        p { color: #555; }
        a {
            display: inline-block;
            margin-top: 20px;
            background-color: #2196F3;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <p>This page does not exist.</p>
        <a th:href="@{/home}">Go home</a>
    </div>
</body>
</html>
